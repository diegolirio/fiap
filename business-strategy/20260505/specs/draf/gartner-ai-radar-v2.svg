  <line x1="634" y1="665" x2="634" y2="710" stroke="#aed581" stroke-width="1"/>

  <!-- KPI 3 -->
  <text x="840" y="681" font-size="10" font-weight="700" fill="#33691e" text-anchor="middle">O QUÃO LONGE (Risk)</text>
