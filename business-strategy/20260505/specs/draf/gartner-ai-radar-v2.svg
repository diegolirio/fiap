      <stop offset="0%"  stop-color="#e0f7fa"/>
      <stop offset="40%" stop-color="#80deea"/>
      <stop offset="75%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#00838f"/>
    </radialGradient>

    <!-- clip each quadrant -->
    <clipPath id="cTL"><rect x="180" y="130" width="270" height="270"/></clipPath>
    <clipPath id="cTR"><rect x="450" y="130" width="270" height="270"/></clipPath>
    <clipPath id="cBL"><rect x="180" y="400" width="270" height="270"/></clipPath>
    <clipPath id="cBR"><rect x="450" y="400" width="270" height="270"/></clipPath>

    <!-- arc paths for curved text -->
    <path id="aTL" d="M 325,198 A 137,137 0 0,1 460,260"/>
    <path id="aTR" d="M 440,198 A 137,137 0 0,0 305,260"/>
    <path id="aBL" d="M 325,522 A 137,137 0 0,0 460,460"/>
    <path id="aBR" d="M 440,522 A 137,137 0 0,1 305,460"/>

    <path id="aTL2" d="M 340,215 A 118,118 0 0,1 448,270"/>
    <path id="aTR2" d="M 460,215 A 118,118 0 0,0 352,270"/>
    <path id="aBL2" d="M 340,505 A 118,118 0 0,0 448,450"/>
