  <text x="550" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Radar de Ambição de IA da Gartner</text>
  <text x="550" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">Hibryd · Arquétipo: AI First / Everywhere</text>

  <!-- === RADAR CIRCLE === -->
