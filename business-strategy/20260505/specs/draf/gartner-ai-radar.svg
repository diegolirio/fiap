    <path id="arcTR" d="M 560,230 A 165,165 0 0,1 735,265"/>
    <path id="arcBL" d="M 365,515 A 165,165 0 0,0 540,550"/>
    <path id="arcBR" d="M 560,550 A 165,165 0 0,0 735,515"/>
  </defs>

