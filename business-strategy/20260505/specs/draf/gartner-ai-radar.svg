<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
  <defs>
    <!-- Gradients for quadrants -->
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  style="stop-color:#e0f2fe;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#bae6fd;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#38bdf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1"/>
    </radialGradient>
    <clipPath id="clipCircle">
      <circle cx="550" cy="390" r="240"/>
    </clipPath>
    <clipPath id="clipTL">
      <path d="M550,390 L310,150 A240,240 0 0,1 550,150 Z"/>
    </clipPath>
    <!-- Background -->
