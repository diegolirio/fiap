<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#091525"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="50%"  stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card1g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#052e16"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="card2g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0c1a3a"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <linearGradient id="card3g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <linearGradient id="kpiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0f2338"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="200"  cy="560" r="320" fill="#10b981" opacity="0.04" filter="url(#softglow)"/>
  <circle cx="1080" cy="200" r="300" fill="#3b82f6" opacity="0.05" filter="url(#softglow)"/>
  <circle cx="640"  cy="360" r="400" fill="#06b6d4" opacity="0.02"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- ── HEADER SECTION ── -->
  <text x="64" y="52" font-size="11" font-weight="400" letter-spacing="4" fill="#475569">HIBRYD  ·  VISÃO  ·  2035</text>

  <!-- Year badge -->
  <rect x="1140" y="28" width="100" height="34" rx="17" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
  <text x="1190" y="51" font-size="16" font-weight="800" fill="#10b981" text-anchor="middle" filter="url(#glow)">2035</text>

  <!-- Main headline -->
  <text x="64" y="106" font-size="42" font-weight="800" fill="#f1f5f9" letter-spacing="-0.5">Estamos em 2035.</text>
  <text x="64" y="148" font-size="18" font-weight="300" fill="#64748b">O que os principais jornais e revistas escrevem sobre a <tspan font-weight="700" fill="#06b6d4">Hibryd</tspan>?</text>

  <!-- Divider -->
  <rect x="64" y="164" width="1152" height="1.5" fill="url(#accent)" opacity="0.4"/>

  <!-- ── TAGLINE CENTRAL ── -->
  <text x="640" y="208" font-size="15" font-style="italic" fill="#94a3b8" text-anchor="middle">
    "Ser a camada de confiança financeira do profissional de saúde brasileiro —
  </text>
  <text x="640" y="228" font-size="15" font-style="italic" fill="#94a3b8" text-anchor="middle">
    onde dados reais substituem preconceitos e crédito justo financia quem cuida de vidas."
  </text>

  <!-- ── 3 HEADLINE CARDS ── -->

  <!-- CARD 1 — Impacto Social -->
  <rect x="64" y="258" width="358" height="290" rx="14" fill="url(#card1g)" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="64" y="258" width="358" height="6" rx="4" fill="#10b981"/>

  <!-- Newspaper icon area -->
  <rect x="80" y="278" width="326" height="52" rx="6" fill="#10b981" opacity="0.08"/>
  <text x="96" y="293" font-size="9" font-weight="600" letter-spacing="2" fill="#10b981" opacity="0.7">FOLHA DE S.PAULO  ·  12 MAR 2035</text>
  <text x="96" y="315" font-size="15" font-weight="700" fill="#d1fae5" leading="1.3">Nenhum médico fica sem crédito</text>

  <line x1="80" y1="340" x2="406" y2="340" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>

  <text font-size="11.5" fill="#94a3b8">
    <tspan x="80" dy="0" y="362">Em 2035, nenhum médico, dentista ou</tspan>
    <tspan x="80" dy="18">fisioterapeuta no Brasil deixará de abrir</tspan>
    <tspan x="80" dy="18">sua clínica por falta de acesso a crédito</tspan>
    <tspan x="80" dy="18">ou por desinformação financeira.</tspan>
  </text>

  <text font-size="11.5" fill="#6ee7b7" font-weight="500">
    <tspan x="80" dy="0" y="446">→ Oferecer crédito que muda a vida</tspan>
    <tspan x="80" dy="18">   de quem cuida de vidas.</tspan>
  </text>

  <!-- Bottom stat -->
  <rect x="80" y="496" width="326" height="40" rx="6" fill="#10b981" opacity="0.1"/>
  <text x="243" y="511" font-size="11" fill="#6ee7b7" text-anchor="middle" font-weight="600">200k+ profissionais impactados</text>
  <text x="243" y="527" font-size="10" fill="#475569" text-anchor="middle">R$ 2bi+ em crédito concedido ao setor</text>

  <!-- CARD 2 — Referência de Mercado -->
  <rect x="461" y="258" width="358" height="290" rx="14" fill="url(#card2g)" stroke="#06b6d4" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="461" y="258" width="358" height="6" rx="4" fill="#06b6d4"/>

  <rect x="477" y="278" width="326" height="52" rx="6" fill="#06b6d4" opacity="0.08"/>
  <text x="493" y="293" font-size="9" font-weight="600" letter-spacing="2" fill="#06b6d4" opacity="0.7">EXAME  ·  SAÚDE FINANCEIRA  ·  2035</text>
  <text x="493" y="315" font-size="14" font-weight="700" fill="#bae6fd">Hibryd lidera o setor de saúde</text>

  <line x1="477" y1="340" x2="803" y2="340" stroke="#06b6d4" stroke-width="0.8" opacity="0.25"/>

  <text font-size="11.5" fill="#94a3b8">
    <tspan x="477" dy="0" y="362">A Hibryd se torna referência nacional</tspan>
    <tspan x="477" dy="18">dentre os profissionais da saúde,</tspan>
    <tspan x="477" dy="18">atingindo 60% dos empreendedores</tspan>
    <tspan x="477" dy="18">do setor de saúde no Brasil.</tspan>
  </text>

  <text font-size="11.5" fill="#7dd3fc" font-weight="500">
    <tspan x="477" dy="0" y="446">→ Score aceito em fintechs, BaaS</tspan>
    <tspan x="477" dy="18">   e apps médicos em todo o país.</tspan>
  </text>

  <rect x="477" y="496" width="326" height="40" rx="6" fill="#06b6d4" opacity="0.1"/>
  <text x="640" y="511" font-size="11" fill="#7dd3fc" text-anchor="middle" font-weight="600">60% dos CNPJs do setor de saúde</text>
  <text x="640" y="527" font-size="10" fill="#475569" text-anchor="middle">3M jornadas de crédito · 50k profissionais ativos</text>

  <!-- CARD 3 — Ecossistema -->
  <rect x="858" y="258" width="358" height="290" rx="14" fill="url(#card3g)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="858" y="258" width="358" height="6" rx="4" fill="#8b5cf6"/>

  <rect x="874" y="278" width="326" height="52" rx="6" fill="#8b5cf6" opacity="0.08"/>
  <text x="890" y="293" font-size="9" font-weight="600" letter-spacing="2" fill="#8b5cf6" opacity="0.7">MIT TECHNOLOGY REVIEW  ·  2035</text>
  <text x="890" y="315" font-size="14" font-weight="700" fill="#ddd6fe">O ecossistema que democratizou</text>
  <text x="890" y="330" font-size="14" font-weight="700" fill="#ddd6fe">o crédito na saúde</text>

  <line x1="874" y1="344" x2="1200" y2="344" stroke="#8b5cf6" stroke-width="0.8" opacity="0.25"/>

  <text font-size="11.5" fill="#94a3b8">
    <tspan x="874" dy="0" y="366">Ser o ecossistema financeiro que</tspan>
    <tspan x="874" dy="18">permite que qualquer profissional</tspan>
    <tspan x="874" dy="18">de saúde no Brasil empreenda com</tspan>
    <tspan x="874" dy="18">dignidade, crédito justo e gestão</tspan>
    <tspan x="874" dy="18">inteligente.</tspan>
  </text>

  <text font-size="11.5" fill="#c4b5fd" font-weight="500">
    <tspan x="874" dy="0" y="460">→ B2B + novos setores · crédito proativo</tspan>
  </text>

  <rect x="874" y="496" width="326" height="40" rx="6" fill="#8b5cf6" opacity="0.1"/>
  <text x="1037" y="511" font-size="11" fill="#c4b5fd" text-anchor="middle" font-weight="600">Trust Layer nacional · 3 novos verticais</text>
  <text x="1037" y="527" font-size="10" fill="#475569" text-anchor="middle">Direito · Arquitetura · Educação</text>

  <!-- ── KPI STRIP ── -->
  <rect x="64" y="572" width="1152" height="90" rx="12" fill="url(#kpiGrad)" stroke="#1e3a5f" stroke-width="1"/>

  <!-- KPI dividers -->
  <line x1="352" y1="582" x2="352" y2="652" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="640" y1="582" x2="640" y2="652" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="928" y1="582" x2="928" y2="652" stroke="#1e3a5f" stroke-width="1"/>

  <!-- KPI 1 -->
  <text x="208" y="610" font-size="32" font-weight="800" fill="#10b981" text-anchor="middle" filter="url(#glow)">3M</text>
  <text x="208" y="630" font-size="11" fill="#64748b" text-anchor="middle">jornadas de crédito</text>
  <text x="208" y="645" font-size="10" fill="#374151" text-anchor="middle">até 2035</text>

  <!-- KPI 2 -->
  <text x="496" y="610" font-size="32" font-weight="800" fill="#06b6d4" text-anchor="middle" filter="url(#glow)">60%</text>
  <text x="496" y="630" font-size="11" fill="#64748b" text-anchor="middle">CNPJs do setor saúde</text>
  <text x="496" y="645" font-size="10" fill="#374151" text-anchor="middle">empreendedores impactados</text>

  <!-- KPI 3 -->
  <text x="784" y="610" font-size="32" font-weight="800" fill="#f59e0b" text-anchor="middle" filter="url(#glow)">R$2bi+</text>
  <text x="784" y="630" font-size="11" fill="#64748b" text-anchor="middle">em crédito concedido</text>
  <text x="784" y="645" font-size="10" fill="#374151" text-anchor="middle">ao setor de saúde</text>

  <!-- KPI 4 -->
  <text x="1072" y="610" font-size="32" font-weight="800" fill="#8b5cf6" text-anchor="middle" filter="url(#glow)">200k+</text>
  <text x="1072" y="630" font-size="11" fill="#64748b" text-anchor="middle">profissionais de saúde</text>
  <text x="1072" y="645" font-size="10" fill="#374151" text-anchor="middle">com crédito justo</text>

  <!-- ── FOOTER ── -->
  <line x1="0" y1="676" x2="1280" y2="676" stroke="#0f2338" stroke-width="1"/>
  <text x="64"   y="698" font-size="10" fill="#1e3a5f">Hibryd — Score Híbrido · Open Finance PF+PJ · ML Auditável · LGPD + CMN 4.557 · Agente IA Financeiro</text>
  <text x="1216" y="698" font-size="10" fill="#1e3a5f" text-anchor="end">Visão 2035</text>

  <!-- Bottom accent -->
  <rect x="0" y="716" width="1280" height="4" fill="url(#accent)"/>
</svg>
